[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -ra
markers =
    tier1: Tier 1 Feature Coverage tests (fast, deterministic, unit level)
    tier2: Tier 2 Boundary, Corner, and Adversarial tests
    tier3: Tier 3 Cross-Feature Combination integration tests
    tier4: Tier 4 Real-World Application Scenario tests
    mock: Tests runnable with MockActuator without requiring OS display
    live_desktop: Tests requiring an interactive macOS display session
