[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task-memory-automator"
version = "0.1.0"
description = "Autonomous Desktop Companion with hands-free OS control and task memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
tui = [
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -ra"
markers = [
    "tier1: Tier 1 Feature Coverage tests",
    "tier2: Tier 2 Boundary, Corner, and Adversarial tests",
    "tier3: Tier 3 Cross-Feature Combination integration tests",
    "tier4: Tier 4 Real-World Application Scenario tests",
    "mock: Headless mock tests runnable anywhere",
    "live_desktop: Live macOS display automation tests",
]
